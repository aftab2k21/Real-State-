name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
defaults:
  run:
    working-directory: linden-apk
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q linden-apk.zip
        working-directory: .
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: linden-debug-apk
          path: linden-apk/android/app/build/outputs/apk/debug/app-debug.apk
